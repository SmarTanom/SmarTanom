version: "3.9"

services:
  expo:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: smartanom-expo
    working_dir: /app
    tty: true          # keep interactive features alive
    stdin_open: true   # allow key commands if you attach
    ports:
      - "19000:19000"   # Metro (native)
      - "19001:19001"   # WebSocket/Logs
      - "19002:19002"   # DevTools (legacy, some versions still use)
      - "19006:19006"   # Expo Web
      - "8081:8081"     # Metro internal (needed for LAN devices)
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_USE_DEV_SERVER: "true"
      WATCHMAN_DISABLE: "true"
      REACT_NATIVE_PACKAGER_HOSTNAME: 0.0.0.0
      NODE_ENV: development
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - ./mobile:/app
      - /app/node_modules        # anonymous volume to persist deps inside container
    command: >-
      sh -c "if [ ! -d node_modules ]; then echo 'Installing node modules...' && (npm ci || npm install); fi; \
      echo 'Starting Expo dev server'; npm run start"
