services:
  expo:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: smartanom-expo
    working_dir: /app
    ports:
      - "19000:19000"   # Metro (native)
      - "19001:19001"   # WebSocket/Logs
      - "19006:19006"   # Expo Web
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_USE_DEV_SERVER=true
      - WATCHMAN_DISABLE=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - NODE_ENV=development
    volumes:
      - ./mobile:/app
    # Do not mask node_modules; keep those installed at build
    # Use LAN mode to avoid interactive tunnel install prompt
    command: ["npm", "run", "start"]
