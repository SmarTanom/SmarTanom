# Backend-only Docker Compose for SmarTanom development
# Use this when you want to run just the backend with database

version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: smartanom-db-backend
    environment:
      POSTGRES_DB: smartanom_dev
      POSTGRES_USER: smartanom
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_backend:/var/lib/postgresql/data
    networks:
      - smartanom-backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartanom -d smartanom_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: smartanom-redis-backend
    ports:
      - "6379:6379"
    volumes:
      - redis_data_backend:/data
    networks:
      - smartanom-backend-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend Django application
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev
    container_name: smartanom-backend-dev
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production-not-secure
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=smartanom_dev
      - DB_USER=smartanom
      - DB_PASSWORD=dev_password_change_in_production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      - EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
      - OTP_EXPIRE_MINUTES=5
      - OTP_MAX_ATTEMPTS=3
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartanom-backend-network
    restart: unless-stopped

volumes:
  postgres_data_backend:
  redis_data_backend:
  backend_logs:

networks:
  smartanom-backend-network:
    driver: bridge
