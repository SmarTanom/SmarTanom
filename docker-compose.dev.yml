# Complete development environment with backend, frontend, mobile, and database
version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: smartanom-db-dev
    environment:
      POSTGRES_DB: smartanom_dev
      POSTGRES_USER: smartanom
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartanom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartanom -d smartanom_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: smartanom-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - smartanom-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend Django application
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      args:
        INSTALL_DEV: "true"
    container_name: smartanom-backend-dev
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=smartanom_dev
      - DB_USER=smartanom
      - DB_PASSWORD=dev_password_change_in_production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - COLLECT_STATIC=0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs_dev:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartanom-network
    restart: unless-stopped

  # Frontend React application (development)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smartanom-frontend-dev
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
      - VITE_APP_BACKEND_HOST=backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - smartanom-network
    restart: unless-stopped

  # Mobile Expo application (development)
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: smartanom-mobile-dev
    tty: true
    stdin_open: true
    ports:
      - "19000:19000"   # Metro (native)
      - "19001:19001"   # WebSocket/Logs
      - "19002:19002"   # DevTools (legacy)
      - "19006:19006"   # Expo Web
      - "8081:8081"     # Metro bundler
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - EXPO_USE_DEV_SERVER=true
      - WATCHMAN_DISABLE=true
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - NODE_ENV=development
      - EXPO_NO_TELEMETRY=1
      - EXPO_API_URL=http://localhost:8000/api
    volumes:
      - ./mobile:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - smartanom-network
    command: >
      sh -c "echo 'Installing dependencies if needed...' &&
             if [ ! -d node_modules ] || [ ! -f node_modules/.package-lock.json ]; then
               npm install;
             fi &&
             echo 'Starting Expo development server...' &&
             npm run start -- --tunnel"
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev:
  backend_logs_dev:

networks:
  smartanom-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
