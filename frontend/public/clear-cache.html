<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear SmarTanom Cache</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #339432 0%, #2d7d2a 100%);
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #1f2937;
      font-size: 28px;
      margin-bottom: 16px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    p {
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    button {
      background: #339432;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 12px;
    }

    button:hover {
      background: #2d7d2a;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(51, 148, 50, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: #6b7280;
    }

    button.secondary:hover {
      background: #4b5563;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
      display: block;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
      display: block;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🧹</div>
    <h1>Clear SmarTanom Cache</h1>
    <p>If you're experiencing a white screen or loading issues, use this tool to clear all cached data and service workers.</p>

    <button onclick="clearAll()">Clear All Cache & Service Workers</button>
    <button class="secondary" onclick="goToApp()">Back to App</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    function showStatus(message, type = 'info') {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = `status ${type}`;
    }

    async function clearAll() {
      showStatus('Clearing cache...', 'info');

      try {
        // Clear all caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          console.log('✅ Cleared', cacheNames.length, 'caches');
        }

        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
          console.log('✅ Unregistered', registrations.length, 'service workers');
        }

        // Clear local storage
        localStorage.clear();
        sessionStorage.clear();

        showStatus('✅ Cache cleared successfully! Redirecting...', 'success');

        // Redirect to app after 2 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);

      } catch (error) {
        console.error('Error clearing cache:', error);
        showStatus('❌ Failed to clear cache: ' + error.message, 'error');
      }
    }

    function goToApp() {
      window.location.href = '/';
    }

    // Auto-clear if ?auto=true is in URL
    if (window.location.search.includes('auto=true')) {
      clearAll();
    }
  </script>
</body>
</html>
