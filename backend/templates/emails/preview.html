<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmarTanom Email Preview</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .preview-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .preview-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .preview-title {
            font-size: 32px;
            font-weight: bold;
            color: #1F2937;
            margin: 0 0 10px 0;
        }
        .preview-subtitle {
            font-size: 16px;
            color: #6B7280;
            margin: 0;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #E5E7EB;
        }
        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #6B7280;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover {
            color: #339432;
        }
        .tab.active {
            color: #339432;
            border-bottom-color: #339432;
        }
        .preview-content {
            display: none;
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            overflow: auto;
        }
        .preview-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            border: none;
            border-radius: 8px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-header">
            <h1 class="preview-title">🌱 Email Alert Preview</h1>
            <p class="preview-subtitle">SmarTanom Alert Notification Templates</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('critical')">🔴 Critical Alert</button>
            <button class="tab" onclick="showTab('warning')">🟡 Warning Alert</button>
            <button class="tab" onclick="showTab('info')">🔵 Info Alert</button>
        </div>

        <!-- Critical Alert -->
        <div id="critical" class="preview-content active">

    <script>
        function showTab(type) {
            // Hide all tabs and contents
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.preview-content').forEach(content => content.classList.remove('active'));

            // Show selected tab and content
            event.target.classList.add('active');
            document.getElementById(type).classList.add('active');
        }
    </script>
</body>
