services:
  - type: web
    name: smartanom-backend
    runtime: python3
    plan: free
    # rootDir tells Render to run build/start commands from this folder
    rootDir: backend
    # Commands are run relative to rootDir, so don't `cd backend` here.
    buildCommand: "pip install -r requirements.txt"
    # Render will automatically use the Procfile in the rootDir (backend/)
    # to determine the start command.
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartanom.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: smartanom-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: smartanom-db
          property: connectionString
      # Temporarily commented out to test without Redis
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: smartanom-redis
      #     property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USE_TLS
        value: true
      - key: DEFAULT_FROM_EMAIL
        value: SmarTanom <noreply@yourdomain.com>
      - key: VAPID_ADMIN_EMAIL
        value: admin@yourdomain.com

databases:
  - name: smartanom-db
    databaseName: smartanom_prod
    user: smartanom

