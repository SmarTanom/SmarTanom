services:
  - type: web
    name: smartanom-backend
    runtime: python3
    plan: free
    # rootDir tells Render to run build/start commands from this folder
    rootDir: backend
  # Commands are run relative to rootDir, so don't `cd backend` here.
  buildCommand: "pip install --no-cache-dir -r requirements.txt"
    # Render will automatically use the Procfile in the rootDir (backend/)
    # to determine the start command.
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartanom.settings
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: smartanom-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: smartanom-db
          property: connectionString
  # Recommended: attach a Redis instance for WebSockets (Django Channels)
  # If omitted, app will fall back to in-memory channel layer (single worker only).
  # - key: REDIS_URL
  #   fromService:
  #     type: redis
  #     name: smartanom-redis
  #     property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      # Email transport: prefer Brevo HTTP API on Render free tier
      - key: EMAIL_TRANSPORT
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: SmarTanom <noreply@yourdomain.com>
      - key: VAPID_ADMIN_EMAIL
        value: admin@yourdomain.com

  - type: worker
    name: smartanom-redis-subscriber
    runtime: python3
    plan: free
    rootDir: backend
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python manage.py run_redis_subscriber"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartanom.settings
      # IMPORTANT: Set REDIS_URL to your Redis (Upstash) redis[s]:// URL so Channels can fan-out across processes
      - key: REDIS_URL
        sync: false
      - key: REDIS_PUBSUB_CHANNEL
        value: smartanom:sensors
      # Enable global broadcast if your dashboards listen on the global devices stream
      - key: WS_GLOBAL_BROADCAST
        value: true

databases:
  - name: smartanom-db
    databaseName: smartanom_prod
    user: smartanom

# Temporarily commented out - uncomment after creating Redis instance
# redis:
#   - name: smartanom-redis

# Optional: Attach a Render Redis service instead of Upstash and set REDIS_URL from it.
