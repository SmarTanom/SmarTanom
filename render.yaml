services:
  - type: web
    name: smartanom-backend
    runtime: python
    plan: free
    # Run build/start from the backend folder
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    # Use our entrypoint script to handle migrations, optional collectstatic/seed, and run Daphne
    startCommand: bash render-entrypoint.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartanom.settings
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: smartanom-backend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: smartanom-db
          property: connectionString
      # Optional: attach a Redis instance and set REDIS_URL for Channels fan-out
      # - key: REDIS_URL
      #   fromService:
      #     type: redis
      #     name: smartanom-redis
      #     property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      # Email transport: prefer Brevo HTTP API on Render free tier
      - key: EMAIL_TRANSPORT
        value: brevo_api
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "SmarTanom <noreply@yourdomain.com>"
      - key: VAPID_ADMIN_EMAIL
        value: admin@yourdomain.com
      # Cloud media storage (recommended on free plan). Set this to enable Cloudinary.
      # Format: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false

    # Optional persistent disk alternative (paid plans only)
    # Uncomment to store media locally on a Render Persistent Disk instead of Cloudinary.
    # disk:
    #   name: media
    #   mountPath: /var/media
    #   sizeGB: 1
    # And set MEDIA_ROOT to the mount path:
    # envVars:
    #   - key: MEDIA_ROOT
    #     value: /var/media

  - type: worker
    name: smartanom-redis-subscriber
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python manage.py run_redis_subscriber
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: smartanom.settings
      - key: PIP_DISABLE_PIP_VERSION_CHECK
        value: "1"
      # IMPORTANT: Set REDIS_URL to your Redis (Upstash) redis[s]:// URL so Channels can fan out across processes
      - key: REDIS_URL
        sync: false
      - key: REDIS_PUBSUB_CHANNEL
        value: smartanom:sensors
      - key: WS_GLOBAL_BROADCAST
        value: "true"

databases:
  - name: smartanom-db
    databaseName: smartanom_prod
    user: smartanom

# Optional: Attach a Render Redis service and set REDIS_URL from it
# redis:
#   - name: smartanom-redis
