# Production Docker setup
version: '3.8'

services:
  # PostgreSQL database (production)
  postgres:
    image: postgres:15-alpine
    container_name: smartanom-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartanom_prod}
      POSTGRES_USER: ${POSTGRES_USER:-smartanom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - smartanom-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartanom} -d ${POSTGRES_DB:-smartanom_prod}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Redis (production)
  redis:
    image: redis:7-alpine
    container_name: smartanom-redis-prod
    volumes:
      - redis_prod_data:/data
    networks:
      - smartanom-prod-network
    restart: unless-stopped

  # Main application (backend + frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartanom-app-prod
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${POSTGRES_DB:-smartanom_prod}
      - DB_USER=${POSTGRES_USER:-smartanom}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "80:8000"
    volumes:
      - app_logs:/app/logs
      - static_files:/app/static
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smartanom-prod-network
    restart: unless-stopped

volumes:
  postgres_prod_data:
  redis_prod_data:
  app_logs:
  static_files:

networks:
  smartanom-prod-network:
    driver: bridge