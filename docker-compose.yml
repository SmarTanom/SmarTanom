# Backend and Frontend only - Lightweight development setup

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: smartanom-db
    environment:
      POSTGRES_DB: smartanom_dev
      POSTGRES_USER: smartanom
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartanom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartanom -d smartanom_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: smartanom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartanom-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Backend Django application
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.dev
    container_name: smartanom-backend
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=smartanom_dev
      - DB_USER=smartanom
      - DB_PASSWORD=dev_password_change_in_production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - COLLECT_STATIC=0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8001:8000"  # Docker uses port 8001 to avoid conflict with local dev server
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartanom-network
    restart: unless-stopped

  # Frontend React application (development)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smartanom-frontend
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8001/api  # Updated to use Docker port 8001
      - VITE_WS_URL=ws://localhost:8001/ws
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - smartanom-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  smartanom-network:
    driver: bridge
