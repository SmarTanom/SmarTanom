services:
  smartanom-mobile:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartanom-mobile-app
    ports:
      # Expo development server
      - "19000:19000"
      # Expo development server (alternative)
      - "19001:19001"
      # Expo development server (alternative)
      - "19002:19002"
      # Metro bundler
      - "8081:8081"
      # Web development server
      - "3000:3000"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_CLI_NO_DOCTOR=1
      - NODE_ENV=development
    volumes:
      # Mount source code for development (optional - comment out for production)
      - ./smartanom-mobile:/app:delegated
      # Exclude node_modules from volume mount
      - /app/node_modules
      # Mount for Expo cache
      - expo-cache:/home/expo/.expo
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - smartanom-network

  # Optional: Add a simple web server for serving the web build
  smartanom-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartanom-web-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    command: ["expo", "start", "--web", "--no-dev", "--minify"]
    volumes:
      - ./smartanom-mobile:/app:delegated
      - /app/node_modules
    restart: unless-stopped
    networks:
      - smartanom-network
    profiles:
      - production

volumes:
  expo-cache:
    driver: local

networks:
  smartanom-network:
    driver: bridge
