# Development Docker setup
version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: smartanom-db
    environment:
      POSTGRES_DB: smartanom_dev
      POSTGRES_USER: smartanom
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartanom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartanom -d smartanom_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: smartanom-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartanom-network

  # Backend Django application
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: smartanom-backend
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=smartanom_dev
      - DB_USER=smartanom
      - DB_PASSWORD=dev_password_change_in_production
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - COLLECT_STATIC=0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - smartanom-network
  # Command handled by entrypoint script defined in Dockerfile

  # Frontend React application (development)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smartanom-frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - smartanom-network
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  smartanom-network:
    driver: bridge